<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ولرو — نقطه‌گذاری قریه‌ها</title>
<link rel="stylesheet" href="/admin/placer/assets/maplibre-gl.css">
<style>
 * { box-sizing: border-box; }
 body { margin:0; font-family: system-ui, sans-serif; display:flex; height:100vh;
        flex-direction: row; background:#0e4d3c; color:#fff; }
 #side { width: 340px; min-width: 280px; display:flex; flex-direction:column;
         padding: 12px; gap: 8px; }
 #map { flex:1; }
 h1 { font-size: 1.1rem; margin: 0; }
 .muted { color:#9dbdb2; font-size:.8rem; }
 input, button { font: inherit; border-radius: 10px; border: none; padding: 10px 12px; }
 input { width: 100%; }
 button { background:#f5c400; color:#1c1b16; font-weight:700; cursor:pointer; }
 button.ghost { background:#1d5c4a; color:#fff; }
 button:disabled { opacity:.4; cursor:default; }
 #list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
 .row { padding:8px 10px; border-radius:10px; background:#124e3e; cursor:pointer;
        display:flex; justify-content:space-between; align-items:center; font-size:.9rem; }
 .row.placed { background:#0b3a2e; color:#8fb8a9; }
 .row.guess { background:#3d3a1c; color:#e8dfa8; }
 .row.active { outline: 2px solid #f5c400; }
 .row small { color:#9dbdb2; }
 #bar { display:flex; gap:8px; }
 #bar button { flex:1; }
 #status { min-height: 1.2em; font-size:.85rem; color:#f5c400; }
 #login { display:flex; flex-direction:column; gap:8px; }
 @media (max-width: 700px) {
   body { flex-direction: column; }
   #side { width:100%; height: 45%; }
 }
</style>
</head>
<body>
<div id="side">
  <h1>نقطه‌گذاری قریه‌ها</h1>
  <div class="muted">قریه را انتخاب کنید، جای آن را روی نقشه بزنید، «ثبت» را فشار دهید.
  ایستگاه‌های بی‌نقطهٔ همان قریه، خودکار همین نقطه را می‌گیرند.</div>

  <div id="login">
    <input id="phone" placeholder="شماره تیلفون ادمین" inputmode="tel">
    <button id="send">ارسال کود</button>
    <input id="code" placeholder="کود تأیید" inputmode="numeric" style="display:none">
    <button id="verify" style="display:none">ورود</button>
  </div>

  <div id="tool" style="display:none; flex-direction:column; gap:8px; flex:1; min-height:0;">
    <input id="search" placeholder="جستجوی قریه…">
    <div class="muted" id="progress"></div>
    <div id="list"></div>
    <div id="status"></div>
    <div id="bar">
      <button id="save" disabled>ثبت نقطه</button>
      <button id="clear" class="ghost" disabled>برداشتن نقطه</button>
    </div>
  </div>
</div>
<div id="map"></div>

<script src="/admin/placer/assets/maplibre-gl.js"></script>
<script>
"use strict";
// The placer talks to the same API the apps do, as the same admin, through
// the same OTP door. The token lives in this tab and nowhere else.
let token = null;
let refreshToken = null;
let refreshing = null;  // the single in-flight refresh, never two
let villages = [];      // full admin listing rows
let selected = null;    // village row
let pin = null;         // maplibre Marker for the pending tap
let districts = {};     // id -> {latitude, longitude}

const $ = (id) => document.getElementById(id);
const send = (path, options = {}) =>
  fetch("/api/v1" + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}),
      ...(options.headers || {}),
    },
  }).then(async (r) => {
    const body = await r.json().catch(() => ({}));
    if (!r.ok || body.success === false) {
      throw new Error((body.error && body.error.code) || r.status);
    }
    return body;
  });

/**
 * Renew the access token, exactly once at a time.
 *
 * Refresh tokens rotate, and the server treats a replayed one as theft: it
 * revokes every session the user has. Two requests expiring together and
 * both refreshing would look precisely like that, and would end an
 * operator's session in the middle of a valley. So every caller waits on
 * the same promise.
 */
function renew() {
  if (!refreshing) {
    refreshing = fetch("/api/v1/auth/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refreshToken, device_id: "placer-web" }),
    }).then(async (r) => {
      const body = await r.json().catch(() => ({}));
      if (!r.ok || body.success === false) throw new Error("refresh");
      token = body.data.access_token;
      refreshToken = body.data.refresh_token;   // rotated: keep the new one
    }).finally(() => { refreshing = null; });
  }
  return refreshing;
}

/**
 * Every call, with one silent retry when the fifteen-minute access token
 * runs out -- which a placing session always outlives. Anything else is
 * passed through: a refusal deserves to be read, not retried.
 */
const api = async (path, options = {}) => {
  try {
    return await send(path, options);
  } catch (e) {
    if (e.message !== "TOKEN_EXPIRED" || !refreshToken) throw e;
    try {
      await renew();
    } catch (_) {
      // The refresh itself is gone (expired, or revoked elsewhere). Ask for
      // the phone again -- and leave the tool exactly as it stands, pin and
      // selection included, so signing back in resumes rather than restarts.
      $("login").style.display = "flex";
      $("status").textContent = "نشست تمام شد — دوباره وارد شوید.";
      throw e;
    }
    return await send(path, options);
  }
};

// Arabic-script shaping, before any map exists. Without it Persian place
// names render left-to-right with unjoined letters, which is worse than no
// labels: سیاه‌گرد reads as "درگ ه‌ای‌س". Failure is survivable, so it is
// caught rather than fatal.
try {
  maplibregl.setRTLTextPlugin(
    "/admin/placer/assets/mapbox-gl-rtl-text.min.js", null, true,
  );
} catch (e) { /* already set, or unsupported: labels degrade, map works */ }

const map = new maplibregl.Map({
  container: "map",
  style: "/api/v1/geo/map/style.json",
  center: [68.8, 34.95],
  zoom: 8.4,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }));

// -- sign in ------------------------------------------------------------
$("send").onclick = async () => {
  try {
    const reply = await api("/auth/otp/request", {
      method: "POST",
      body: JSON.stringify({ phone: $("phone").value.trim(), locale: "fa-AF" }),
    });
    $("code").style.display = $("verify").style.display = "block";
    // A development server echoes the code it just sent; production refuses
    // to (shared/config.py). Filling it in here is therefore not a hole --
    // it is only ever possible when the server has already decided this
    // machine is a development one, and it saves the operator reading a log.
    if (reply.data && reply.data.debug_code) {
      $("code").value = reply.data.debug_code;
      $("status").textContent = "کود توسط سرور محلی پر شد.";
    }
    $("code").focus();
  } catch (e) { alert("ارسال نشد: " + e.message); }
};
$("verify").onclick = async () => {
  try {
    const reply = await api("/auth/otp/verify", {
      method: "POST",
      body: JSON.stringify({
        phone: $("phone").value.trim(),
        code: $("code").value.trim(),
        device_id: "placer-web",
        locale: "fa-AF",
      }),
    });
    token = reply.data.access_token;
    refreshToken = reply.data.refresh_token;
    $("login").style.display = "none";
    $("tool").style.display = "flex";
    await load();
  } catch (e) { alert("ورود نشد: " + e.message); }
};

// -- data ---------------------------------------------------------------
async function load() {
  const anchors = await api("/admin/districts");
  for (const d of anchors.data) districts[d.id] = d;

  villages = [];
  for (let offset = 0; ; offset += 200) {
    const page = await api(`/admin/villages?limit=200&offset=${offset}`);
    villages.push(...page.data);
    if (villages.length >= page.meta.total) break;
  }
  render();
  drawPlaced();
}

// Three states, not two. A seeded guess looks placed and is not: the very
// first one an operator checked was fourteen kilometres wrong, so it sorts
// with the work, not with the finished.
const stateOf = (v) =>
  v.latitude === null ? "unplaced" : v.from_seed ? "guess" : "done";
const RANK = { unplaced: 0, guess: 1, done: 2 };

function render() {
  const q = $("search").value.trim();
  const shown = villages.filter(
    (v) => !q || v.name.includes(q) || v.district_name.includes(q)
  ).sort((a, b) =>
    RANK[stateOf(a)] - RANK[stateOf(b)] || a.name.localeCompare(b.name, "fa")
  );

  const count = (list, state) => list.filter((v) => stateOf(v) === state).length;
  let line = `مانده: ${count(villages, "unplaced")} از ${villages.length} قریه`;
  const guesses = count(villages, "guess");
  if (guesses) line += ` · ${guesses} نقطهٔ نمونه برای بررسی`;
  if (selected) {
    // The district he is actually working through, so progress is visible
    // at the scale he works at rather than only at the scale of everything.
    const mine = villages.filter((v) => v.district_id === selected.district_id);
    line += ` · ${selected.district_name}: ${count(mine, "done")} از ${mine.length}`;
  }
  $("progress").textContent = line;

  $("list").replaceChildren(...shown.map((v) => {
    const state = stateOf(v);
    const el = document.createElement("div");
    el.className = "row" + (state === "done" ? " placed" : "") +
                   (state === "guess" ? " guess" : "") +
                   (selected && selected.id === v.id ? " active" : "");
    const mark = state === "done" ? " ✓" : state === "guess" ? " ⚠︎" : "";
    el.innerHTML = `<span>${v.name}</span><small>${v.district_name}${mark}</small>`;
    el.onclick = () => select(v);
    return el;
  }));
}

function select(v) {
  selected = v;
  dropPin(null);
  $("status").textContent =
    v.latitude === null ? "جای این قریه را روی نقشه بزنید."
    : v.from_seed ? "این نقطه حدس نمونه است — درستش را بزنید."
    : "نقطه دارد — برای جابه‌جایی، جای نو را بزنید.";
  $("clear").disabled = v.latitude === null;
  render();
  const district = districts[v.district_id];
  const anchor = v.latitude !== null
    ? [v.longitude, v.latitude]
    : district && district.latitude !== null
      ? [district.longitude, district.latitude]
      : null;
  // Only move the map when the target is not already on screen. Placing a
  // valley means placing neighbours, and flying back to the district centre
  // after every save threw away the zoom he had just set -- so he zoomed in
  // again, every single time.
  if (anchor && !map.getBounds().contains(anchor)) {
    map.flyTo({ center: anchor, zoom: v.latitude !== null ? 13 : 11 });
  }
}

map.on("click", (e) => {
  if (!selected) return;
  dropPin([e.lngLat.lng, e.lngLat.lat]);
  $("status").textContent =
    `${selected.name}: ${e.lngLat.lat.toFixed(5)}, ${e.lngLat.lng.toFixed(5)} — ثبت؟`;
  $("save").disabled = false;
});

function dropPin(lnglat) {
  if (pin) { pin.remove(); pin = null; }
  if (lnglat) {
    pin = new maplibregl.Marker({ color: "#f5c400" }).setLngLat(lnglat).addTo(map);
  } else {
    $("save").disabled = true;
  }
}

$("save").onclick = async () => {
  if (!selected || !pin) return;
  const { lng, lat } = pin.getLngLat();
  try {
    const reply = await api(`/admin/villages/${selected.id}/coordinates`, {
      method: "PATCH",
      body: JSON.stringify({ latitude: lat.toFixed(6), longitude: lng.toFixed(6) }),
    });
    selected.latitude = lat; selected.longitude = lng;
    selected.from_seed = false;
    $("status").textContent =
      `ثبت شد ✓ (${reply.data.stations_updated.length} ایستگاه هم‌نقطه شد)`;
    dropPin(null); drawPlaced();
    // Straight to the next unplaced village in the same district: the whole
    // session is "walk the valley in your head, tap, tap, tap".
    const wanted = (v) => stateOf(v) !== "done";
    const next = villages.find(
      (v) => wanted(v) && v.district_id === selected.district_id
    ) || villages.find(wanted);
    if (next) select(next); else { selected = null; render(); }
  } catch (e) { $("status").textContent = "ثبت نشد: " + e.message; }
};

$("clear").onclick = async () => {
  if (!selected || selected.latitude === null) return;
  if (!confirm(`نقطهٔ «${selected.name}» و ایستگاه‌هایش برداشته شود؟`)) return;
  try {
    await api(`/admin/villages/${selected.id}/coordinates`, {
      method: "PATCH",
      body: JSON.stringify({ latitude: null, longitude: null }),
    });
    selected.latitude = null; selected.longitude = null;
    $("status").textContent = "برداشته شد.";
    $("clear").disabled = true;
    drawPlaced(); render();
  } catch (e) { $("status").textContent = "نشد: " + e.message; }
};

$("search").oninput = render;

// Enter saves the pin. Four hundred villages is four hundred round trips
// from the map to a button; the keyboard shortens each one.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.target === $("search")) return;
  if (!$("save").disabled) { e.preventDefault(); $("save").click(); }
});

// Every placed village as a small dot, so the next tap has neighbours to
// line up against.
function drawPlaced() {
  const features = villages
    .filter((v) => v.latitude !== null)
    .map((v) => ({
      type: "Feature",
      geometry: { type: "Point", coordinates: [v.longitude, v.latitude] },
      properties: { name: v.name },
    }));
  const data = { type: "FeatureCollection", features };
  const source = map.getSource("placed");
  if (source) { source.setData(data); return; }
  map.addSource("placed", { type: "geojson", data });
  map.addLayer({
    id: "placed-dots", type: "circle", source: "placed",
    paint: {
      "circle-radius": 4, "circle-color": "#0e4d3c",
      "circle-stroke-color": "#ffffff", "circle-stroke-width": 1.2,
    },
  });
  map.addLayer({
    id: "placed-names", type: "symbol", source: "placed",
    layout: {
      "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"],
      "text-size": 10, "text-offset": [0, 1.1],
    },
    paint: { "text-color": "#0e4d3c", "text-halo-color": "#fff", "text-halo-width": 1 },
  });
}
map.on("load", drawPlaced);
</script>
</body>
</html>
