<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ولرو — نقطه‌گذاری قریه‌ها</title>
<link rel="stylesheet" href="/admin/placer/assets/maplibre-gl.css">
<style>
 * { box-sizing: border-box; }
 body { margin:0; font-family: system-ui, sans-serif; display:flex; height:100vh;
        flex-direction: row; background:#0e4d3c; color:#fff; }
 #side { width: 340px; min-width: 280px; display:flex; flex-direction:column;
         padding: 12px; gap: 8px; }
 #map { flex:1; }
 h1 { font-size: 1.1rem; margin: 0; }
 .muted { color:#9dbdb2; font-size:.8rem; }
 input, button { font: inherit; border-radius: 10px; border: none; padding: 10px 12px; }
 input { width: 100%; }
 button { background:#f5c400; color:#1c1b16; font-weight:700; cursor:pointer; }
 button.ghost { background:#1d5c4a; color:#fff; }
 button:disabled { opacity:.4; cursor:default; }
 #list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
 .row { padding:8px 10px; border-radius:10px; background:#124e3e; cursor:pointer;
        display:flex; justify-content:space-between; align-items:center; font-size:.9rem; }
 .row.placed { background:#0b3a2e; color:#8fb8a9; }
 .row.active { outline: 2px solid #f5c400; }
 .row small { color:#9dbdb2; }
 #bar { display:flex; gap:8px; }
 #bar button { flex:1; }
 #status { min-height: 1.2em; font-size:.85rem; color:#f5c400; }
 #login { display:flex; flex-direction:column; gap:8px; }
 @media (max-width: 700px) {
   body { flex-direction: column; }
   #side { width:100%; height: 45%; }
 }
</style>
</head>
<body>
<div id="side">
  <h1>نقطه‌گذاری قریه‌ها</h1>
  <div class="muted">قریه را انتخاب کنید، جای آن را روی نقشه بزنید، «ثبت» را فشار دهید.
  ایستگاه‌های بی‌نقطهٔ همان قریه، خودکار همین نقطه را می‌گیرند.</div>

  <div id="login">
    <input id="phone" placeholder="شماره تیلفون ادمین" inputmode="tel">
    <button id="send">ارسال کود</button>
    <input id="code" placeholder="کود تأیید" inputmode="numeric" style="display:none">
    <button id="verify" style="display:none">ورود</button>
  </div>

  <div id="tool" style="display:none; flex-direction:column; gap:8px; flex:1; min-height:0;">
    <input id="search" placeholder="جستجوی قریه…">
    <div class="muted" id="progress"></div>
    <div id="list"></div>
    <div id="status"></div>
    <div id="bar">
      <button id="save" disabled>ثبت نقطه</button>
      <button id="clear" class="ghost" disabled>برداشتن نقطه</button>
    </div>
  </div>
</div>
<div id="map"></div>

<script src="/admin/placer/assets/maplibre-gl.js"></script>
<script>
"use strict";
// The placer talks to the same API the apps do, as the same admin, through
// the same OTP door. The token lives in this tab and nowhere else.
let token = null;
let villages = [];      // full admin listing rows
let selected = null;    // village row
let pin = null;         // maplibre Marker for the pending tap
let districts = {};     // id -> {latitude, longitude}

const $ = (id) => document.getElementById(id);
const api = (path, options = {}) =>
  fetch("/api/v1" + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}),
      ...(options.headers || {}),
    },
  }).then(async (r) => {
    const body = await r.json().catch(() => ({}));
    if (!r.ok || body.success === false) {
      throw new Error((body.error && body.error.code) || r.status);
    }
    return body;
  });

const map = new maplibregl.Map({
  container: "map",
  style: "/api/v1/geo/map/style.json",
  center: [68.8, 34.95],
  zoom: 8.4,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }));

// -- sign in ------------------------------------------------------------
$("send").onclick = async () => {
  try {
    await api("/auth/otp/request", {
      method: "POST",
      body: JSON.stringify({ phone: $("phone").value.trim(), locale: "fa-AF" }),
    });
    $("code").style.display = $("verify").style.display = "block";
    $("code").focus();
  } catch (e) { alert("ارسال نشد: " + e.message); }
};
$("verify").onclick = async () => {
  try {
    const reply = await api("/auth/otp/verify", {
      method: "POST",
      body: JSON.stringify({
        phone: $("phone").value.trim(),
        code: $("code").value.trim(),
        device_id: "placer-web",
        locale: "fa-AF",
      }),
    });
    token = reply.data.access_token;
    $("login").style.display = "none";
    $("tool").style.display = "flex";
    await load();
  } catch (e) { alert("ورود نشد: " + e.message); }
};

// -- data ---------------------------------------------------------------
async function load() {
  const anchors = await api("/admin/districts");
  for (const d of anchors.data) districts[d.id] = d;

  villages = [];
  for (let offset = 0; ; offset += 200) {
    const page = await api(`/admin/villages?limit=200&offset=${offset}`);
    villages.push(...page.data);
    if (villages.length >= page.meta.total) break;
  }
  render();
  drawPlaced();
}

function render() {
  const q = $("search").value.trim();
  const rows = villages
    .filter((v) => !q || v.name.includes(q) || v.district_name.includes(q))
    .sort((a, b) =>
      (a.latitude === null) === (b.latitude === null)
        ? a.name.localeCompare(b.name, "fa")
        : a.latitude === null ? -1 : 1
    );
  const unplaced = villages.filter((v) => v.latitude === null).length;
  $("progress").textContent =
    `مانده: ${unplaced} از ${villages.length} قریه`;
  $("list").replaceChildren(...rows.map((v) => {
    const el = document.createElement("div");
    el.className = "row" + (v.latitude !== null ? " placed" : "") +
                   (selected && selected.id === v.id ? " active" : "");
    el.innerHTML = `<span>${v.name}</span><small>${v.district_name}` +
                   (v.latitude !== null ? " ✓" : "") + "</small>";
    el.onclick = () => select(v);
    return el;
  }));
}

function select(v) {
  selected = v;
  dropPin(null);
  $("status").textContent = v.latitude !== null
    ? "نقطه دارد — برای جابه‌جایی، جای نو را بزنید."
    : "جای این قریه را روی نقشه بزنید.";
  $("clear").disabled = v.latitude === null;
  render();
  const anchor = v.latitude !== null
    ? [v.longitude, v.latitude]
    : districts[v.district_id] && districts[v.district_id].latitude !== null
      ? [districts[v.district_id].longitude, districts[v.district_id].latitude]
      : null;
  if (anchor) map.flyTo({ center: anchor, zoom: v.latitude !== null ? 13 : 11 });
}

map.on("click", (e) => {
  if (!selected) return;
  dropPin([e.lngLat.lng, e.lngLat.lat]);
  $("status").textContent =
    `${selected.name}: ${e.lngLat.lat.toFixed(5)}, ${e.lngLat.lng.toFixed(5)} — ثبت؟`;
  $("save").disabled = false;
});

function dropPin(lnglat) {
  if (pin) { pin.remove(); pin = null; }
  if (lnglat) {
    pin = new maplibregl.Marker({ color: "#f5c400" }).setLngLat(lnglat).addTo(map);
  } else {
    $("save").disabled = true;
  }
}

$("save").onclick = async () => {
  if (!selected || !pin) return;
  const { lng, lat } = pin.getLngLat();
  try {
    const reply = await api(`/admin/villages/${selected.id}/coordinates`, {
      method: "PATCH",
      body: JSON.stringify({ latitude: lat.toFixed(6), longitude: lng.toFixed(6) }),
    });
    selected.latitude = lat; selected.longitude = lng;
    $("status").textContent =
      `ثبت شد ✓ (${reply.data.stations_updated.length} ایستگاه هم‌نقطه شد)`;
    dropPin(null); drawPlaced();
    // Straight to the next unplaced village in the same district: the whole
    // session is "walk the valley in your head, tap, tap, tap".
    const next = villages.find(
      (v) => v.latitude === null && v.district_id === selected.district_id
    ) || villages.find((v) => v.latitude === null);
    if (next) select(next); else { selected = null; render(); }
  } catch (e) { $("status").textContent = "ثبت نشد: " + e.message; }
};

$("clear").onclick = async () => {
  if (!selected || selected.latitude === null) return;
  if (!confirm(`نقطهٔ «${selected.name}» و ایستگاه‌هایش برداشته شود؟`)) return;
  try {
    await api(`/admin/villages/${selected.id}/coordinates`, {
      method: "PATCH",
      body: JSON.stringify({ latitude: null, longitude: null }),
    });
    selected.latitude = null; selected.longitude = null;
    $("status").textContent = "برداشته شد.";
    $("clear").disabled = true;
    drawPlaced(); render();
  } catch (e) { $("status").textContent = "نشد: " + e.message; }
};

$("search").oninput = render;

// Every placed village as a small dot, so the next tap has neighbours to
// line up against.
function drawPlaced() {
  const features = villages
    .filter((v) => v.latitude !== null)
    .map((v) => ({
      type: "Feature",
      geometry: { type: "Point", coordinates: [v.longitude, v.latitude] },
      properties: { name: v.name },
    }));
  const data = { type: "FeatureCollection", features };
  const source = map.getSource("placed");
  if (source) { source.setData(data); return; }
  map.addSource("placed", { type: "geojson", data });
  map.addLayer({
    id: "placed-dots", type: "circle", source: "placed",
    paint: {
      "circle-radius": 4, "circle-color": "#0e4d3c",
      "circle-stroke-color": "#ffffff", "circle-stroke-width": 1.2,
    },
  });
  map.addLayer({
    id: "placed-names", type: "symbol", source: "placed",
    layout: {
      "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"],
      "text-size": 10, "text-offset": [0, 1.1],
    },
    paint: { "text-color": "#0e4d3c", "text-halo-color": "#fff", "text-halo-width": 1 },
  });
}
map.on("load", drawPlaced);
</script>
</body>
</html>
