# Deployment configuration. Secrets never live here -- they come from the
# environment. Anything an operator may need to change without a redeploy is a
# row in app_settings, not a key in this file.
environment = "development"
log_level = "INFO"
log_json = false
# Real SMS again. With this off the code is not returned in the API response,
# so signing in needs a handset that can receive one -- which is the point.
#
# Turn it back on only on a machine where nobody but the developer can reach
# the API. shared/config.py refuses it outright when environment = production,
# so this line cannot follow a deployment out.
otp_debug_echo = false
cors_origins = ["http://localhost:5173"]

# The geofence: asks and bookings must come from within reach of a known
# station (radius in app_settings, geofence.radius_m). The tester's own
# handset is exempted by environment variable, never by this file --
#   export VELRO_GEOFENCE_EXEMPT_PHONES="+93793817977"
# -- so the exemption cannot ride a config file into production.
