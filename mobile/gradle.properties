org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Kotlin 2.0.x does not support JDK 26, which is what a Homebrew Gradle picks up
# by default on this machine. Pin the daemon to the installed JDK 21 LTS.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home

# The version, in one place for both apps.
#
# Passenger and driver are two artifacts of one product and ship together, so
# they carry the same number -- two apps drifting to 1.4 and 1.7 is a support
# conversation nobody can hold ("which version?" "of which one?").
#
# versionCode is what Android compares to decide whether an install is an
# upgrade. It only ever goes up, and it is not the same thing as the name a
# person reads. Raise both here; nothing else needs editing.
velro.versionName=1.1.0
velro.versionCode=2
