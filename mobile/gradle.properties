org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Which JDK runs the build is a fact about a machine, not about the project,
# so it is deliberately NOT pinned here. This file is committed, and a path
# like /Library/Java/JavaVirtualMachines/... is true on exactly one laptop --
# it sat here for a day and failed every CI run on GitHub with "Java home
# supplied is invalid", where no such directory exists. Pin the JDK in your
# own ~/.gradle/gradle.properties instead (Kotlin 2.0.x needs 17-21; a Homebrew
# Gradle otherwise picks up whatever JDK 26 it finds):
#
#   org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home

# The version, in one place for both apps.
#
# Passenger and driver are two artifacts of one product and ship together, so
# they carry the same number -- two apps drifting to 1.4 and 1.7 is a support
# conversation nobody can hold ("which version?" "of which one?").
#
# versionCode is what Android compares to decide whether an install is an
# upgrade. It only ever goes up, and it is not the same thing as the name a
# person reads. Raise both here; nothing else needs editing.
velro.versionName=1.2.0
velro.versionCode=3
