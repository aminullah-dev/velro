<!doctype html>
<html lang="fa-AF" dir="rtl">
<head>
<meta charset="utf-8">
<title>ویلرو — تیزر لب دریای غوربند (مینیمال)</title>
<link rel="stylesheet" href="../05-assets/fonts/vazirmatn.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// A minimal, flat driving loop along the Ghorband river: a car on a clean road
// beside the water, a couple of soft mountain silhouettes, lots of quiet space.
// Every visible thing is a pure function of `phase` in [0,1) so the loop is
// seamless. render-video.sh draws one frame per screenshot via #f=..&N=.. .
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1080, H = 1920;

const hash = new URLSearchParams(location.hash.slice(1));
const F = parseInt(hash.get('f') || '0', 10);
const N = parseInt(hash.get('N') || '144', 10);
const phase = ((F % N) + N) % N / N;

// ---- scene ----
const HZ = Math.round(H * 0.46);          // horizon (a touch of extra ground)
const VPX = W * 0.5;
const Znear = 4, Zfar = 64, rangeZ = Zfar - Znear;
const XK = 116;
const RW = 2.4;
const LOOP = 32;
const travel = phase * LOOP;
const dashGap = 2.4, dashLen = 1.15, dashHalf = 0.15;
const riverW = 3.6, riverGap = 0.7;
const bendAmp = 1.7, bendFreq = 2 * Math.PI / LOOP;   // one gentle bend per loop
const carZ = 7, carW = 2.2;

const projY = z => HZ + (H - HZ) * (Znear / z);
const projS = z => Znear / z;
const sx = (x, z) => VPX + x * projS(z) * XK;
const roadC = z => bendAmp * Math.sin((z + travel) * bendFreq);
const riverC = z => roadC(z) - (RW + riverGap + riverW / 2);
const wrap = (v, m) => ((v % m) + m) % m;

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---- flat sky, a soft sun, two calm ridges ----
function sky() {
  ctx.fillStyle = '#E7F0EA'; ctx.fillRect(0, 0, W, HZ + 2);
  ctx.fillStyle = '#F3EAD6';                       // low warm band at the horizon
  ctx.fillRect(0, HZ - 130, W, 132);
  ctx.fillStyle = '#FBF3DE';                       // simple flat sun
  ctx.beginPath(); ctx.arc(W * 0.5, HZ - 150, 96, 0, 7); ctx.fill();
}
function ridge(yBase, amp, color, f1, ph) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, HZ + 2);
  for (let x = 0; x <= W; x += 14) ctx.lineTo(x, yBase - amp * (0.6 * Math.sin(x * f1 + ph) + 0.4 * Math.sin(x * f1 * 2.7 + 1.3)));
  ctx.lineTo(W, HZ + 2); ctx.closePath(); ctx.fill();
}
function mountains() {
  const sway = 10 * Math.sin(2 * Math.PI * phase);
  ridge(HZ - 40, 118, '#AEC4BA', 0.0034, 1.1 + sway * 0.002);
  ridge(HZ + 6, 78, '#8AAA9A', 0.0046, 3.4 - sway * 0.002);
}

function bandPath(xL, xR) {
  ctx.beginPath(); let first = true;
  for (let z = Zfar; z >= Znear; z -= 0.6) { const p = sx(xL(z), z), y = projY(z); first ? (ctx.moveTo(p, y), first = false) : ctx.lineTo(p, y); }
  for (let z = Znear; z <= Zfar; z += 0.6) ctx.lineTo(sx(xR(z), z), projY(z));
  ctx.closePath();
}
function ground() { ctx.fillStyle = '#316049'; ctx.fillRect(0, HZ, W, H - HZ); }

function river() {
  bandPath(z => riverC(z) - riverW / 2, z => riverC(z) + riverW / 2);
  ctx.fillStyle = '#4894A1'; ctx.fill();
  // one quiet highlight line along the near-side bank, no busy shimmer
  ctx.strokeStyle = 'rgba(226,244,247,.5)'; ctx.lineWidth = 4;
  ctx.beginPath();
  for (let z = Zfar; z >= Znear; z -= 0.6) { const x = sx(riverC(z) + riverW / 2, z), y = projY(z); z === Zfar ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
}

function road() {
  bandPath(z => roadC(z) - RW, z => roadC(z) + RW);
  ctx.fillStyle = '#262B31'; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(240,240,236,.28)';
  for (const side of [-1, 1]) { ctx.beginPath(); for (let z = Zfar; z >= Znear; z -= 0.6) { const x = sx(roadC(z) + side * (RW - 0.07), z), y = projY(z); z === Zfar ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); }
  ctx.fillStyle = '#F1F1EC';
  for (let k = 0; k < rangeZ / dashGap + 2; k++) {
    const z = Znear + wrap(k * dashGap - travel, rangeZ);
    if (z + dashLen > Zfar) continue;
    const yF = projY(z + dashLen), yN = projY(z);
    ctx.beginPath();
    ctx.moveTo(sx(roadC(z + dashLen) - dashHalf, z + dashLen), yF);
    ctx.lineTo(sx(roadC(z + dashLen) + dashHalf, z + dashLen), yF);
    ctx.lineTo(sx(roadC(z) + dashHalf, z), yN);
    ctx.lineTo(sx(roadC(z) - dashHalf, z), yN);
    ctx.closePath(); ctx.fill();
  }
}

function car() {
  const s = projS(carZ) * XK, cx = sx(roadC(carZ), carZ);
  const cy = projY(carZ) + Math.sin(2 * Math.PI * 2 * phase) * 4;
  const bw = carW * s, bh = bw * 0.72;
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0, bh * 0.06, bw * 0.6, bh * 0.15, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#15181C'; ctx.fillRect(-bw * 0.5, -bh * 0.02, bw * 0.15, bh * 0.28); ctx.fillRect(bw * 0.35, -bh * 0.02, bw * 0.15, bh * 0.28);
  rr(-bw * 0.5, -bh * 0.62, bw, bh * 0.72, bw * 0.12); ctx.fillStyle = '#ECE7D8'; ctx.fill();
  rr(-bw * 0.33, -bh * 1.0, bw * 0.66, bh * 0.48, bw * 0.11); ctx.fillStyle = '#E4DDCB'; ctx.fill();
  rr(-bw * 0.27, -bh * 0.9, bw * 0.54, bh * 0.32, bw * 0.06); ctx.fillStyle = '#1B3A42'; ctx.fill();
  ctx.fillStyle = '#E24A3B'; rr(-bw * 0.45, -bh * 0.32, bw * 0.15, bh * 0.15, bw * 0.03); ctx.fill(); rr(bw * 0.3, -bh * 0.32, bw * 0.15, bh * 0.15, bw * 0.03); ctx.fill();
  ctx.restore();
}

// ---- minimal overlay: small green wordmark up top, small "به‌زودی" below ----
function markPath(g, ox, oy, sc, road, dash) {
  const P = v => v * sc;
  g.fillStyle = road; g.beginPath();
  [[54,78],[36,30],[45,30],[54,58],[63,30],[72,30]].forEach((p, i) => { const x = ox + P(p[0] - 54), y = oy + P(p[1] - 54); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.closePath(); g.fill();
  g.fillStyle = dash;
  [[53,70,2,6],[53,60,2,5],[53,51,2,4]].forEach(d => g.fillRect(ox + P(d[0] - 54), oy + P(d[1] - 54 - d[3]), P(d[2]), P(d[3])));
}
function overlay() {
  // top: mark + VELRO, in brand green on the pale sky
  ctx.save();
  const my = 150;
  markPath(ctx, W * 0.5 - 118, my, 44 / 48, '#0E6042', '#189669');
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#0E6042'; ctx.font = '800 46px "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('VELRO', W * 0.5 - 78, my + 2);
  ctx.restore();

  // bottom: a soft scrim, a smaller "به‌زودی", a quiet corridor line, both
  // lifted clear of the very bottom so a story's own UI never covers them
  const g = ctx.createLinearGradient(0, H - 470, 0, H);
  g.addColorStop(0, 'rgba(9,36,24,0)'); g.addColorStop(0.5, 'rgba(9,36,24,.55)'); g.addColorStop(1, 'rgba(9,36,24,.9)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 470, W, 470);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFFFFF'; ctx.font = '900 96px Vazirmatn, sans-serif';
  ctx.fillText('به‌زودی', W / 2, H - 240);
  ctx.fillStyle = 'rgba(233,247,241,.85)'; ctx.font = '500 34px Vazirmatn, sans-serif';
  ctx.fillText('کابل — چاریکار — غوربند', W / 2, H - 166);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  sky(); mountains(); ground(); river(); road(); car(); overlay();
  document.title = 'ready';
}
(async () => { try { await document.fonts.load('900 96px Vazirmatn'); await document.fonts.load('500 34px Vazirmatn'); await document.fonts.ready; } catch (e) {} draw(); })();
</script>
</body>
</html>
