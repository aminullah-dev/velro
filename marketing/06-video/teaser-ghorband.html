<!doctype html>
<html lang="fa-AF" dir="rtl">
<head>
<meta charset="utf-8">
<title>ویلرو — تیزر لب دریای غوربند</title>
<link rel="stylesheet" href="../05-assets/fonts/vazirmatn.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// A seamless driving loop along the Ghorband river. Every visible thing is a
// pure function of `phase` in [0,1): the road dashes, the roadside poles, the
// river shimmer and the road's bend all scroll by one whole period over the
// loop, so frame N-1 hands back to frame 0 with no jump. render-video.sh draws
// one frame per Chrome screenshot by passing #f=<frame>&N=<total> in the URL.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1080, H = 1920;

// ---- which frame ----
const hash = new URLSearchParams(location.hash.slice(1));
const F = parseInt(hash.get('f') || '0', 10);
const N = parseInt(hash.get('N') || '144', 10);
const phase = ((F % N) + N) % N / N;      // 0..1

// ---- scene constants ----
const HZ = Math.round(H * 0.40);          // horizon
const VPX = W * 0.52;                      // vanishing point x
const Znear = 4, Zfar = 64, rangeZ = Zfar - Znear;
const XK = 118;                            // world->screen scale at Znear
const RW = 2.5;                            // road half width (world)
const LOOP = 32;                           // world units travelled per loop
const travel = phase * LOOP;
const dashGap = 2, dashLen = 1.1, dashHalf = 0.16;
const poleGap = 8, flowGap = 4;
const riverW = 4.4, riverGap = 0.7;
const bendAmp = 2.2, bendFreq = 2 * Math.PI / LOOP;   // one bend-period per loop
const carZ = 7, carW = 2.3;

const projY = z => HZ + (H - HZ) * (Znear / z);
const projS = z => Znear / z;
const sx = (x, z) => VPX + x * projS(z) * XK;
// The road centre weaves; the pattern scrolls toward the camera with `travel`.
const roadC = z => bendAmp * Math.sin((z + travel) * bendFreq);
const riverC = z => roadC(z) - (RW + riverGap + riverW / 2);
const wrap = (v, m) => ((v % m) + m) % m;

function lerp(a, b, t) { return a + (b - a) * t; }

// ---------- sky & mountains ----------
function sky() {
  const g = ctx.createLinearGradient(0, 0, 0, HZ + 60);
  g.addColorStop(0, '#A7D2E6'); g.addColorStop(0.55, '#CFE6EC'); g.addColorStop(1, '#F2E4C4');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ + 60);
  // a soft sun haze low on the horizon
  const s = ctx.createRadialGradient(W * 0.7, HZ, 10, W * 0.7, HZ, 360);
  s.addColorStop(0, 'rgba(255,246,214,.85)'); s.addColorStop(1, 'rgba(255,246,214,0)');
  ctx.fillStyle = s; ctx.fillRect(0, 0, W, HZ + 60);
}
function ridge(yBase, amp, color, f1, f2, f3, ph, alpha) {
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, HZ + 40);
  for (let x = 0; x <= W; x += 16) {
    const y = yBase - amp * (0.55 * Math.sin(x * f1 + ph) + 0.3 * Math.sin(x * f2 + 2.1) + 0.15 * Math.sin(x * f3 + 5.3));
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, HZ + 40); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
}
function mountains() {
  const sway = 14 * Math.sin(2 * Math.PI * phase);        // one gentle sway per loop
  ridge(HZ - 150, 150, '#7C93A0', 0.0033, 0.010, 0.021, 1.2 + sway * 0.002, 1);
  ridge(HZ - 70, 120, '#5F7E88', 0.0041, 0.013, 0.026, 3.0 - sway * 0.002, 1);
  ridge(HZ - 6, 74, '#46705A', 0.0052, 0.017, 0.033, 5.5 + sway * 0.003, 1);
}

// ---------- ground plane helpers ----------
// Build a screen polygon for a world band [xLeft(z), xRight(z)] over z=Zfar..Znear.
function bandPath(xL, xR) {
  ctx.beginPath();
  let first = true;
  for (let z = Zfar; z >= Znear; z -= 0.5) { const p = sx(xL(z), z), y = projY(z); if (first) { ctx.moveTo(p, y); first = false; } else ctx.lineTo(p, y); }
  for (let z = Znear; z <= Zfar; z += 0.5) { ctx.lineTo(sx(xR(z), z), projY(z)); }
  ctx.closePath();
}

function ground() {
  const g = ctx.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, '#3B6B4C'); g.addColorStop(1, '#274F39');
  ctx.fillStyle = g; ctx.fillRect(0, HZ, W, H - HZ);
}

function river() {
  // water body
  bandPath(z => riverC(z) - riverW / 2, z => riverC(z) + riverW / 2);
  const g = ctx.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, '#2C8296'); g.addColorStop(1, '#1C6274');
  ctx.fillStyle = g; ctx.fill();
  // a brighter near edge
  ctx.save(); ctx.clip();
  // flow highlights scrolling toward camera
  for (let k = 0; k < rangeZ / flowGap + 2; k++) {
    const z = Znear + wrap(k * flowGap - travel, rangeZ);
    const y0 = projY(z), y1 = projY(z + 0.6);
    const a = 0.10 + 0.10 * projS(z);
    ctx.fillStyle = 'rgba(224,246,250,' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(sx(riverC(z) - riverW / 2, z), y0); ctx.lineTo(sx(riverC(z) + riverW / 2, z), y0);
    ctx.lineTo(sx(riverC(z + 0.6) + riverW / 2, z + 0.6), y1); ctx.lineTo(sx(riverC(z + 0.6) - riverW / 2, z + 0.6), y1);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function road() {
  bandPath(z => roadC(z) - RW, z => roadC(z) + RW);
  const g = ctx.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, '#33383F'); g.addColorStop(1, '#23272D');
  ctx.fillStyle = g; ctx.fill();
  // soft shoulders
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(233,233,230,.35)';
  for (const side of [-1, 1]) {
    ctx.beginPath();
    for (let z = Zfar; z >= Znear; z -= 0.5) { const x = sx(roadC(z) + side * (RW - 0.08), z), y = projY(z); z === Zfar ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // scrolling centre dashes
  ctx.fillStyle = '#F1F1EC';
  for (let k = 0; k < rangeZ / dashGap + 2; k++) {
    const z = Znear + wrap(k * dashGap - travel, rangeZ);
    if (z + dashLen > Zfar) continue;
    const yF = projY(z + dashLen), yN = projY(z);
    ctx.beginPath();
    ctx.moveTo(sx(roadC(z + dashLen) - dashHalf, z + dashLen), yF);
    ctx.lineTo(sx(roadC(z + dashLen) + dashHalf, z + dashLen), yF);
    ctx.lineTo(sx(roadC(z) + dashHalf, z), yN);
    ctx.lineTo(sx(roadC(z) - dashHalf, z), yN);
    ctx.closePath(); ctx.fill();
  }
}

function poles() {
  const list = [];
  for (let k = 0; k < rangeZ / poleGap + 2; k++) {
    const z = Znear + wrap(k * poleGap - travel, rangeZ);
    list.push(z);
  }
  list.sort((a, b) => b - a);                 // far first
  for (const z of list) {
    const s = projS(z) * XK;
    const baseX = sx(roadC(z) + RW + 0.9, z), baseY = projY(z);
    const h = 2.4 * s, w = Math.max(1, 0.10 * s);
    ctx.fillStyle = '#C9C9C4'; ctx.fillRect(baseX - w / 2, baseY - h, w, h);
    ctx.fillStyle = '#F59E0B'; ctx.fillRect(baseX - w * 1.4, baseY - h, w * 2.8, w * 2.8); // reflector
  }
}

// ---------- the car, from behind ----------
function car() {
  const s = projS(carZ) * XK;
  const cx = sx(roadC(carZ), carZ);
  const bob = Math.sin(2 * Math.PI * 2 * phase) * 5;
  const cy = projY(carZ) + bob;
  const bw = carW * s, bh = bw * 0.72;
  ctx.save(); ctx.translate(cx, cy);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, bh * 0.06, bw * 0.62, bh * 0.16, 0, 0, 7); ctx.fill();
  // wheels
  ctx.fillStyle = '#15181C';
  ctx.fillRect(-bw * 0.52, -bh * 0.02, bw * 0.16, bh * 0.30);
  ctx.fillRect(bw * 0.36, -bh * 0.02, bw * 0.16, bh * 0.30);
  // body (rear)
  const bodyTop = -bh * 0.62, bodyBot = bh * 0.10;
  rr(-bw * 0.5, bodyTop, bw, bodyBot - bodyTop, bw * 0.10); ctx.fillStyle = '#ECE7D8'; ctx.fill();
  // roof / cabin
  rr(-bw * 0.34, -bh * 1.02, bw * 0.68, bh * 0.5, bw * 0.10); ctx.fillStyle = '#E4DDCB'; ctx.fill();
  // rear window
  rr(-bw * 0.28, -bh * 0.92, bw * 0.56, bh * 0.34, bw * 0.06); ctx.fillStyle = '#18333B'; ctx.fill();
  // taillights
  ctx.fillStyle = '#E24A3B';
  rr(-bw * 0.46, -bh * 0.34, bw * 0.16, bh * 0.16, bw * 0.03); ctx.fill();
  rr(bw * 0.30, -bh * 0.34, bw * 0.16, bh * 0.16, bw * 0.03); ctx.fill();
  // bumper
  ctx.fillStyle = '#C9C3B2'; ctx.fillRect(-bw * 0.5, -bh * 0.06, bw, bh * 0.10);
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- brand overlay ----------
function markPath(g, ox, oy, sc) {           // the road-V, scaled, white road + mint dashes
  const P = v => v * sc;
  g.fillStyle = '#FFFFFF';
  g.beginPath();
  const road = [[54,78],[36,30],[45,30],[54,58],[63,30],[72,30]];
  road.forEach((p, i) => { const x = ox + P(p[0] - 54), y = oy + P(p[1] - 54); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.closePath(); g.fill();
  g.fillStyle = '#8FD9BC';
  [[53,70,2,6],[53,60,2,5],[53,51,2,4]].forEach(d => { g.fillRect(ox + P(d[0] - 54), oy + P(d[1] - 54 - d[3]), P(d[2]), P(d[3])); });
}
function overlay() {
  // top: small chip + wordmark
  const chip = 96, cxp = W * 0.5;
  ctx.save();
  rr(cxp - 150, 70, chip, chip, 24); ctx.fillStyle = '#06301F'; ctx.fill();
  markPath(ctx, cxp - 150 + chip / 2, 70 + chip / 2, chip * 0.62 / 48);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.font = '800 62px "Helvetica Neue", Arial, sans-serif';
  ctx.fillText('VELRO', cxp - 30, 70 + chip * 0.42);
  ctx.fillStyle = '#8FD9BC'; ctx.font = '700 30px Vazirmatn, sans-serif';
  ctx.fillText('ویلرو', cxp - 30, 70 + chip * 0.82);
  ctx.restore();

  // bottom: scrim + "به‌زودی" + corridor
  const g = ctx.createLinearGradient(0, H - 620, 0, H);
  g.addColorStop(0, 'rgba(6,32,20,0)'); g.addColorStop(0.55, 'rgba(6,32,20,.72)'); g.addColorStop(1, 'rgba(6,32,20,.95)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 620, W, 620);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#8FD9BC'; ctx.font = '700 34px "Helvetica Neue", Arial, sans-serif';
  ctx.save(); ctx.translate(0, 0);
  drawTracked('COMING SOON', W / 2, H - 430, 10);
  ctx.restore();
  ctx.fillStyle = '#FFFFFF'; ctx.font = '900 190px Vazirmatn, sans-serif';
  ctx.fillText('به‌زودی', W / 2, H - 250);
  // amber spark
  ctx.fillStyle = '#F59E0B'; rr(W / 2 - 70, H - 196, 140, 9, 5); ctx.fill();
  // corridor
  ctx.fillStyle = 'rgba(255,255,255,.12)'; rr(W / 2 - 300, H - 150, 600, 76, 38); ctx.fill();
  ctx.fillStyle = '#EAF7F1'; ctx.font = '600 40px Vazirmatn, sans-serif';
  ctx.fillText('کابل — چاریکار — غوربند', W / 2, H - 100);
}
function drawTracked(txt, cx, y, tracking) {
  ctx.textAlign = 'left';
  const widths = [...txt].map(ch => ctx.measureText(ch).width + tracking);
  let total = widths.reduce((a, b) => a + b, 0) - tracking;
  let x = cx - total / 2;
  [...txt].forEach((ch, i) => { ctx.fillText(ch, x, y); x += widths[i]; });
  ctx.textAlign = 'center';
}

// ---------- vignette ----------
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.35, W / 2, H * 0.5, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  sky(); mountains(); ground(); river(); road(); poles(); car(); vignette(); overlay();
  document.title = 'ready';
}

// wait for the Persian font, then draw once (no animation loop -> deterministic)
(async () => { try { await document.fonts.load('900 190px Vazirmatn'); await document.fonts.load('700 40px Vazirmatn'); await document.fonts.ready; } catch (e) {} draw(); })();
</script>
</body>
</html>
