# The Xcode project, as text. `make project` turns this into Velro.xcodeproj,
# which is not in git: a generated project that is also hand-edited is two
# sources of truth that drift.
name: Velro
options:
  bundleIdPrefix: af.velro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 27RXPRW77S
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  VelroCore:
    path: VelroCore
targets:
  VelroPassenger:
    type: application
    platform: iOS
    sources:
      - path: VelroPassenger
      # The text and the Pashto-complete face are the Android app's own files,
      # referenced rather than copied, so a correction made once reaches both.
      - path: ../backend/resources/locales/en.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/fa-AF.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/ps.json
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_regular.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_medium.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_bold.ttf
        type: file
        buildPhase: resources
      # The font's licence travels with it, as the OFL requires.
      - path: ../mobile/core/ui/src/main/assets/licences/vazirmatn-OFL.txt
        type: file
        buildPhase: resources
    dependencies:
      - package: VelroCore
    info:
      path: VelroPassenger/Info.plist
      properties:
        CFBundleDisplayName: VELRO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Set per configuration below, so a Debug build cannot reach production.
        VelroAPIBaseURL: $(VELRO_API_BASE_URL)
        # Plain http to this Mac's own server in development. Local addresses
        # only; everything else still requires TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The system prompt's own words; translated in Resources/*.lproj from
        # the same sentence the app shows before iOS asks.
        NSLocationWhenInUseUsageDescription: VELRO asks for your location only to confirm you are inside the service area.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [fa, ps, en]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: af.velro.passenger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          VELRO_API_BASE_URL: http://localhost:8000/api/v1/
        Release:
          VELRO_API_BASE_URL: https://api.velro.linumic.com/api/v1/
    scheme:
      testTargets:
        - VelroPassengerUITests

  # The driver's app. Its own screens live in VelroDriver/; the brand, the
  # controls, sign-in, help and account deletion are the passenger app's own
  # files, compiled into this target as well rather than copied, so a fix to
  # one of them reaches both apps. Each app has its own AppModel, Router and
  # AppFlavor, which is all those shared files ask of it.
  VelroDriver:
    type: application
    platform: iOS
    sources:
      - path: VelroDriver
      - path: VelroPassenger/Components
      - path: VelroPassenger/Theme
      - path: VelroPassenger/Features/SignIn
      - path: VelroPassenger/Features/Safety
      - path: VelroPassenger/Features/Account/DeleteAccountView.swift
      - path: VelroPassenger/App/AppDelegate.swift
      - path: ../backend/resources/locales/en.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/fa-AF.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/ps.json
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_regular.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_medium.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_bold.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/assets/licences/vazirmatn-OFL.txt
        type: file
        buildPhase: resources
    dependencies:
      - package: VelroCore
    info:
      path: VelroDriver/Info.plist
      properties:
        CFBundleDisplayName: VELRO Driver
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        VelroAPIBaseURL: $(VELRO_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # When In Use only. While he carries a trip the app keeps the fix going
        # with the screen off (the blue pill in the status bar says so); it
        # never asks for Always, and never runs in the background off a trip.
        NSLocationWhenInUseUsageDescription: VELRO Driver uses your location while you are on a trip, to show your car to the passengers you are driving and to warn you about dangerous stretches of road.
        UIBackgroundModes: [location]
        NSCameraUsageDescription: VELRO Driver uses the camera to photograph your documents, your vehicle's papers and your face, so VELRO can check who is driving.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [fa, ps, en]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: af.velro.driver
        # Its own numbers; `scripts/upload.sh --app driver` bumps the marked line.
        MARKETING_VERSION: "1.0.0" # driver
        CURRENT_PROJECT_VERSION: "2" # driver
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          VELRO_API_BASE_URL: http://localhost:8000/api/v1/
        Release:
          VELRO_API_BASE_URL: https://api.velro.linumic.com/api/v1/
    scheme:
      testTargets:
        - VelroDriverUITests

  # The operations console: the web admin panel (admin/src) as a native app,
  # on iPhone, iPad and Mac from this one target. Staff only -- the shell is in
  # VelroOps/App, the design system in VelroOps/Design, and each screen in its
  # own folder under VelroOps/Features. Its own keychain entry and its own
  # numbers; Debug talks to this Mac's API like the other two.
  VelroOps:
    type: application
    supportedDestinations: [iOS, macOS]
    platform: auto
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: VelroOps
        # Staging files of new locale keys, merged into the locale JSON by
        # hand; bundling them would ship them, and two collide in the build.
        excludes: ["**/NEW_KEYS*.json"]
      - path: ../backend/resources/locales/en.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/fa-AF.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/ps.json
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_regular.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_medium.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_bold.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/assets/licences/vazirmatn-OFL.txt
        type: file
        buildPhase: resources
    dependencies:
      - package: VelroCore
      # The Apple Watch app travels inside the iPhone app (Watch/), and only
      # there: the Mac build neither builds nor embeds it.
      - target: VelroOpsWatch
        destinationFilters: [iOS]
    info:
      path: VelroOps/Info.plist
      properties:
        CFBundleDisplayName: VELRO Ops
        CFBundleName: VELRO Ops
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        VelroAPIBaseURL: $(VELRO_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [fa, ps, en]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: af.velro.ops
        # Its own numbers, marked like the driver's.
        MARKETING_VERSION: "1.0.0" # ops
        CURRENT_PROJECT_VERSION: "3" # ops
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        # The Mac build runs in the App Sandbox, allowed out to the API and
        # nothing else. The session lives in the login keychain, which a
        # sandboxed app may use for its own items without a sharing group.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: VelroOps/Resources/VelroOps-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
      configs:
        Debug:
          VELRO_API_BASE_URL: http://localhost:8000/api/v1/
        Release:
          VELRO_API_BASE_URL: https://api.velro.linumic.com/api/v1/
    scheme: {}

  # VELRO Ops on the Apple Watch: what needs somebody right now, for
  # glancing. A single-target watchOS app inside the iPhone app, with its own
  # sign-in and keychain entry (refresh tokens rotate, so it cannot share the
  # phone's). Its numbers are the console's, marked `# ops`, because App Store
  # Connect wants an embedded watch app's build number to match its phone's.
  VelroOpsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: VelroOpsWatch
        excludes: ["**/NEW_KEYS*.json"]
      - path: ../backend/resources/locales/en.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/fa-AF.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/ps.json
        type: file
        buildPhase: resources
    dependencies:
      - package: VelroCore
      - target: VelroOpsWatchWidgets
    info:
      path: VelroOpsWatch/Info.plist
      properties:
        CFBundleDisplayName: VELRO Ops
        CFBundleName: VELRO Ops
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: af.velro.ops
        ITSAppUsesNonExemptEncryption: false
        VelroAPIBaseURL: $(VELRO_API_BASE_URL)
        VelroSharedGroup: $(VELRO_SHARED_GROUP)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [fa, ps, en]
    entitlements:
      path: VelroOpsWatch/Resources/VelroOpsWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(VELRO_SHARED_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: af.velro.ops.watchkitapp
        MARKETING_VERSION: "1.0.0" # ops
        CURRENT_PROJECT_VERSION: "3" # ops
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        # Inside VelroOps.app, not an archive product of its own.
        SKIP_INSTALL: YES
        # Shared with the complications: the summary, the language and the
        # access token they may borrow. An App Group is also a keychain
        # access group on watchOS.
        VELRO_SHARED_GROUP: group.af.velro.ops
      configs:
        Debug:
          VELRO_API_BASE_URL: http://localhost:8000/api/v1/
        Release:
          VELRO_API_BASE_URL: https://api.velro.linumic.com/api/v1/
    scheme: {}

  # The watch-face complications: the attention total and its first lines.
  # The shared shapes are the watch app's own Shared/ files, compiled in.
  VelroOpsWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: VelroOpsWatchWidgets
        excludes: ["**/NEW_KEYS*.json"]
      - path: VelroOpsWatch/Shared
        excludes: ["**/NEW_KEYS*.json"]
      - path: ../backend/resources/locales/en.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/fa-AF.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/ps.json
        type: file
        buildPhase: resources
    dependencies:
      - package: VelroCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: VelroOpsWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: VELRO Ops
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        VelroAPIBaseURL: $(VELRO_API_BASE_URL)
        VelroSharedGroup: $(VELRO_SHARED_GROUP)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [fa, ps, en]
    entitlements:
      path: VelroOpsWatchWidgets/VelroOpsWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(VELRO_SHARED_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: af.velro.ops.watchkitapp.widgets
        MARKETING_VERSION: "1.0.0" # ops
        CURRENT_PROJECT_VERSION: "3" # ops
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        VELRO_SHARED_GROUP: group.af.velro.ops
      configs:
        Debug:
          VELRO_API_BASE_URL: http://localhost:8000/api/v1/
        Release:
          VELRO_API_BASE_URL: https://api.velro.linumic.com/api/v1/

  VelroDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VelroDriverUITests]
    dependencies:
      - target: VelroDriver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: af.velro.driver.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: VelroDriver

  # Drives the real app in the simulator against `make api`: `make ui-test`.
  VelroPassengerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VelroPassengerUITests]
    dependencies:
      - target: VelroPassenger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: af.velro.passenger.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: VelroPassenger
