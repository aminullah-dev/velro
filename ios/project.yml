# The Xcode project, as text. `make project` turns this into Velro.xcodeproj,
# which is not in git: a generated project that is also hand-edited is two
# sources of truth that drift.
name: Velro
options:
  bundleIdPrefix: af.velro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 27RXPRW77S
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VelroCore:
    path: VelroCore
targets:
  VelroPassenger:
    type: application
    platform: iOS
    sources:
      - path: VelroPassenger
      # The text and the Pashto-complete face are the Android app's own files,
      # referenced rather than copied, so a correction made once reaches both.
      - path: ../backend/resources/locales/en.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/fa-AF.json
        type: file
        buildPhase: resources
      - path: ../backend/resources/locales/ps.json
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_regular.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_medium.ttf
        type: file
        buildPhase: resources
      - path: ../mobile/core/ui/src/main/res/font/vazirmatn_bold.ttf
        type: file
        buildPhase: resources
      # The font's licence travels with it, as the OFL requires.
      - path: ../mobile/core/ui/src/main/assets/licences/vazirmatn-OFL.txt
        type: file
        buildPhase: resources
    dependencies:
      - package: VelroCore
    info:
      path: VelroPassenger/Info.plist
      properties:
        CFBundleDisplayName: VELRO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Set per configuration below, so a Debug build cannot reach production.
        VelroAPIBaseURL: $(VELRO_API_BASE_URL)
        # Plain http to this Mac's own server in development. Local addresses
        # only; everything else still requires TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The system prompt's own words; translated in Resources/*.lproj from
        # the same sentence the app shows before iOS asks.
        NSLocationWhenInUseUsageDescription: VELRO asks for your location only to confirm you are inside the service area.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [fa, ps, en]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: af.velro.passenger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          VELRO_API_BASE_URL: http://localhost:8000/api/v1/
        Release:
          VELRO_API_BASE_URL: https://api.velro.linumic.com/api/v1/
    scheme:
      testTargets:
        - VelroPassengerUITests

  # Drives the real app in the simulator against `make api`: `make ui-test`.
  VelroPassengerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [VelroPassengerUITests]
    dependencies:
      - target: VelroPassenger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: af.velro.passenger.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: VelroPassenger
