# Every push runs everything. The suites are the product's memory of every
# bug it has ever had; a push that skips them is a push that can bring one
# back.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velro
          POSTGRES_PASSWORD: velro
          POSTGRES_DB: velro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U velro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VELRO_DATABASE_URL: postgresql+psycopg://velro:velro@localhost:5432/velro_test
      VELRO_JWT_SECRET: ci-secret-key-at-least-32-characters-long
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python scripts/seed.py
      # The geography is master data in a file; importing it here means
      # every push proves the file can still rebuild what it describes.
      - run: python scripts/geography.py import
      - run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test -q
        working-directory: mobile
